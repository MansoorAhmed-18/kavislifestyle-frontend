<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 100" fill="none">
  <!-- Express Shopping Bag Group (tilted ~4 deg) -->
  <g transform="translate(6, 6) scale(0.92)">
    <!-- Speed/Express Motion Lines on Left -->
    <g stroke="#FFBA00" stroke-width="3.5" stroke-linecap="round">
      <line x1="9" y1="46" x2="31" y2="46" />
      <line x1="5" y1="55" x2="28" y2="55" />
      <line x1="10" y1="64" x2="26" y2="64" />
      <line x1="14" y1="73" x2="25" y2="73" />
    </g>

    <!-- Express Bag Handle -->
    <path
      d="M47 37 C47 23, 70 23, 70 37"
      fill="none"
      stroke="#FFBA00"
      stroke-width="4.5"
      stroke-linecap="round"
    />

    <!-- Express Shopping Bag Body -->
    <path
      d="M38 37 L79 35 C82.5 35, 84.5 37.5, 84 41 L78 81 C77.5 84.5, 74.5 86.5, 71 86.5 L36 86.5 C32.5 86.5, 30 84.5, 30.5 81 L35.5 41 C36 37.5, 37 37, 38 37 Z"
      fill="#0C2038"
      stroke="#FFBA00"
      stroke-width="5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Bold Italic "K" Lettermark -->
    <path d="M45 47.5 L53 47.5 L47 75 L39 75 Z" fill="#FFFFFF" />
    <path d="M48.5 61.5 L64.5 47.5 L73.5 47.5 L55 63 Z" fill="#FFFFFF" />
    <path d="M53 60 L68.5 75 L59.5 75 L46.5 62 Z" fill="#FFFFFF" />
  </g>

  <!-- Typography Group -->
  <g transform="translate(94, 16)">
    <!-- Kavi's -->
    <text
      x="0"
      y="31"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="32"
      letter-spacing="-0.02em"
      fill="#0C2038"
    >
      Kavi’s
    </text>

    <!-- Lifestyle -->
    <text
      x="0"
      y="60"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="900"
      font-size="29"
      letter-spacing="-0.01em"
      fill="#FFBA00"
    >
      Lifestyle
    </text>

    <!-- Tagline -->
    <text
      x="1"
      y="76"
      font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif"
      font-weight="600"
      font-size="9.5"
      letter-spacing="0.04em"
      fill="#5C554E"
    >
      Everything You Love, Under One Roof.
    </text>
  </g>
</svg>
