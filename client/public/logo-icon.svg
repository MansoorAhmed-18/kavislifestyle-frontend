<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Navy Blue Rounded App Tile Background -->
  <rect x="1" y="1" width="98" height="98" rx="22" fill="#0C2038" stroke="#FFBA00" stroke-width="2" stroke-opacity="0.35" />

  <!-- Speed/Express Motion Lines on Left -->
  <g stroke="#FFBA00" stroke-width="3.5" stroke-linecap="round">
    <line x1="9" y1="46" x2="31" y2="46" />
    <line x1="5" y1="55" x2="28" y2="55" />
    <line x1="10" y1="64" x2="26" y2="64" />
    <line x1="14" y1="73" x2="25" y2="73" />
  </g>

  <!-- Express Bag Handle -->
  <path
    d="M47 37 C47 23, 70 23, 70 37"
    fill="none"
    stroke="#FFBA00"
    stroke-width="4.5"
    stroke-linecap="round"
  />

  <!-- Express Shopping Bag Body (tilted ~4 deg) -->
  <path
    d="M38 37 L79 35 C82.5 35, 84.5 37.5, 84 41 L78 81 C77.5 84.5, 74.5 86.5, 71 86.5 L36 86.5 C32.5 86.5, 30 84.5, 30.5 81 L35.5 41 C36 37.5, 37 37, 38 37 Z"
    fill="#0C2038"
    stroke="#FFBA00"
    stroke-width="5"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Bold Italic "K" Lettermark -->
  <!-- Stem -->
  <path
    d="M45 47.5 L53 47.5 L47 75 L39 75 Z"
    fill="#FFFFFF"
  />
  <!-- Upper Arm -->
  <path
    d="M48.5 61.5 L64.5 47.5 L73.5 47.5 L55 63 Z"
    fill="#FFFFFF"
  />
  <!-- Lower Leg -->
  <path
    d="M53 60 L68.5 75 L59.5 75 L46.5 62 Z"
    fill="#FFFFFF"
  />
</svg>
